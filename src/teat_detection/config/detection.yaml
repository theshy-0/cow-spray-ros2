detector_node:
  ros__parameters:
    intensity_topic: "/camera_node/intensity"
    depth_topic: "/camera_node/depth"
    camera_info_topic: "/camera_node/camera_info"
    range_offset_topic: "/camera_node/range_offset_mm"
    detections_topic: "/detector_node/detections"
    model_path: ""
    target_class_id: 0
    confidence: 0.50
    iou: 0.45
    inference_size: 256
    device: ""
    parent_frame: "sick_camera_optical_frame"
    child_frame: "target"
    roi_scale: 0.50
    min_valid_points: 8
    max_depth_m: 10.0

sick_yolo_debug:
  ros__parameters:
    intensity_topic: "/camera_node/intensity"
    depth_topic: "/camera_node/depth"
    detections_topic: "/detector_node/detections"
    tracked_detections_topic: "/udder/tracked_detections"
    udder_status_topic: "/udder/status"
    entry_status_topic: "/entry/status"
    teat_image_topic: "/teat_detection/debug_image"
    entry_image_topic: "/leg_entry/debug_image"
    # 可选综合叠加画面；保留原话题以兼容现有rqt和文档。
    image_topic: "/sick_yolo_debug/image"
    base_frame: "base_link"
    enable_vision_csv: true
    vision_csv_path: "/tmp/vision_stability.csv"
    vision_summary_path: "/tmp/vision_stability_summary.json"
    vision_csv_flush_rows: 32
    vision_tf_timeout: 0.05
    # 仅用于诊断日志，不参与检测、滤波或控制。
    debug_pixel_jump_threshold: 8.0
    debug_depth_jump_threshold: 0.03
    debug_cam_jump_threshold: 0.03
    debug_base_jump_threshold: 0.03

handeye_marker_node:
  ros__parameters:
    intensity_topic: "/camera_node/intensity"
    camera_info_topic: "/camera_node/camera_info"
    debug_image_topic: "/handeye_marker/debug_image"
    dictionary: "DICT_4X4_50"
    marker_id: 0
    marker_size_m: 0.12
    parent_frame: "sick_camera_optical_frame"
    child_frame: "calibration_marker"
    axis_length_m: 0.06

teat_id_node:
  ros__parameters:
    detections_topic: "/detector_node/detections"
    tracked_detections_topic: "/udder/tracked_detections"
    target_class_id: "0"
    camera_frame_override: "sick_camera_optical_frame"
    udder_frame: "udder_frame"
    publish_legacy_teat_tf: false
    expected_z_camera: [0.0, 0.0, 1.0]
    front_is_smaller_v: true
    # 相机正对乳房时，奶牛解剖左侧位于图像右侧。
    left_is_smaller_u: false
    min_detection_score: 0.35
    max_match_distance: 0.08
    max_fit_residual: 0.02
    two_point_timeout: 0.30
    max_prediction_translation: 0.05
    max_prediction_rotation_deg: 15.0
    reacquire_after_failures: 5
    reacquire_stable_frames: 5

leg_entry_node:
  ros__parameters:
    enabled: true
    depth_topic: "/camera_node/depth"
    camera_info_topic: "/camera_node/camera_info"
    range_offset_topic: "/camera_node/range_offset_mm"
    status_topic: "/entry/status"
    enable_topic: "/entry/detection_enabled"
    base_frame: "base_link"
    camera_frame: "sick_camera_optical_frame"
    tf_timeout: 0.05
    min_depth_mm: 400.0
    max_depth_mm: 1000.0
    leg_row_start_ratio: 0.75
    leg_row_end_ratio: 0.95
    min_leg_separation_px: 30
    min_leg_height_px: 20
    min_leg_aspect_ratio: 0.9
    min_leg_blob_area_px: 20
    # 必须现场标定后设置为大于0的真实值；0会保持corridor_clear=false。
    leg_gap_min_m: 0.1
    leg_gap_max_m: 2.0
    stable_window_frames: 6
    stable_min_valid_frames: 2
    stable_duration: 0.20
    max_center_spread_m: 0.10
    max_gap_spread_m: 0.15
    production_axis: [1.0, 0.0, 0.0]
