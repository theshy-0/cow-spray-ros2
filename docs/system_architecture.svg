<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">cow_spray_ws ROS 2 系统结构图</title>
  <desc id="desc">SICK ToF 相机同时支持牛腿入场检测和乳头识别。安全入场后可选牛腿预跟随，随后锁定牛腿检测并切换到四乳头 PBVS 动作。控制器包含七秒周期、喷头许可和故障锁存，唯一 250Hz CRI 线程控制 ESTUN 机械臂。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#172033"/></marker>
    <marker id="arrowTf" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#07869a"/></marker>
    <marker id="arrowCtl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6842c2"/></marker>
    <marker id="arrowSafe" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#c86514"/></marker>
    <style>
      .title{font:600 34px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.subtitle{font:400 17px system-ui,"Microsoft YaHei",sans-serif;fill:#5f6b7a}.section{font:600 17px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.node{font:600 16px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.text{font:400 14px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.small{font:400 12px system-ui,"Microsoft YaHei",sans-serif;fill:#5f6b7a}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.box{stroke:#9aa6b5;stroke-width:1.4;rx:12}.camera{fill:#eaf1ff}.vision{fill:#ecf8ed}.entry{fill:#fff5df}.tf{fill:#e8f8fb}.control{fill:#edf2ff}.robot{fill:#f3ecff}.safe{fill:#fff0ec}.neutral{fill:#f5f7fa}.topic{fill:none;stroke:#172033;stroke-width:2;marker-end:url(#arrow)}.dataBus{fill:none;stroke:#7c8796;stroke-width:1.8}.junction{fill:#7c8796}.tfline{fill:none;stroke:#07869a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrowTf)}.controlLine{fill:none;stroke:#6842c2;stroke-width:2;stroke-dasharray:9 4 2 4;marker-end:url(#arrowCtl)}.safeLine{fill:none;stroke:#c86514;stroke-width:2.1;marker-end:url(#arrowSafe)}.mutedLine{fill:none;stroke:#7c8796;stroke-width:1.6;stroke-dasharray:5 5;marker-end:url(#arrow)}.sep{stroke:#c6ccd5;stroke-width:1.2;stroke-dasharray:6 7}.phase{stroke:#6842c2;stroke-width:1.5;fill:#f7f3ff;rx:18}.pass{fill:#ecf8ed;stroke:#4d9460;stroke-width:1.4;rx:10}.block{fill:#fff0ec;stroke:#c9604c;stroke-width:1.4;rx:10}
    </style>
  </defs>

  <text x="900" y="46" text-anchor="middle" class="title">cow_spray_ws 当前 ROS 2 系统结构图</text>
  <text x="900" y="76" text-anchor="middle" class="subtitle">牛腿安全入场 → 可选预跟随 → 乳头识别与补点 → 3D PBVS → ESTUN 实时控制</text>
  <line x1="300" y1="110" x2="300" y2="880" class="sep"/><line x1="720" y1="110" x2="720" y2="880" class="sep"/><line x1="1085" y1="110" x2="1085" y2="880" class="sep"/><line x1="1450" y1="110" x2="1450" y2="880" class="sep"/>

  <rect x="25" y="100" width="250" height="42" class="box camera"/><text x="150" y="127" text-anchor="middle" class="section">1. 传感器与采集</text>
  <rect x="325" y="100" width="370" height="42" class="box vision"/><text x="510" y="127" text-anchor="middle" class="section">2. 感知：牛腿 + 乳头</text>
  <rect x="745" y="100" width="315" height="42" class="box tf"/><text x="902" y="127" text-anchor="middle" class="section">3. 时间、ID 与 TF2</text>
  <rect x="1110" y="100" width="315" height="42" class="box control"/><text x="1267" y="127" text-anchor="middle" class="section">4. 状态机与视觉伺服</text>
  <rect x="1475" y="100" width="300" height="42" class="box robot"/><text x="1625" y="127" text-anchor="middle" class="section">5. 执行器与安全输出</text>

  <rect x="35" y="245" width="105" height="150" class="box camera"/><text x="87" y="280" text-anchor="middle" class="node">SICK</text><text x="87" y="305" text-anchor="middle" class="text">Visionary-T</text><text x="87" y="328" text-anchor="middle" class="text">Mini</text><text x="87" y="359" text-anchor="middle" class="small">ToF 深度相机</text><text x="87" y="379" text-anchor="middle" class="small mono">192.168.1.30</text>
  <rect x="165" y="235" width="120" height="170" class="box camera"/><text x="225" y="268" text-anchor="middle" class="node mono">/camera_node</text><text x="225" y="297" text-anchor="middle" class="text">TCP 采集</text><text x="225" y="322" text-anchor="middle" class="text">统一采集时间戳</text><text x="225" y="347" text-anchor="middle" class="text">深度无效值→0</text><text x="225" y="372" text-anchor="middle" class="small">frame_timeout=0.3s</text><path d="M140 320H165" class="topic"/>

  <rect x="315" y="170" width="190" height="34" class="box camera"/><text x="410" y="192" text-anchor="middle" class="small mono">/camera_node/intensity</text>
  <rect x="315" y="215" width="190" height="34" class="box camera"/><text x="410" y="237" text-anchor="middle" class="small mono">/camera_node/depth</text>
  <rect x="315" y="260" width="190" height="34" class="box camera"/><text x="410" y="282" text-anchor="middle" class="small mono">/camera_node/camera_info</text>
  <rect x="315" y="305" width="190" height="34" class="box camera"/><text x="410" y="327" text-anchor="middle" class="small mono">/camera_node/range_offset_mm</text>
  <path d="M285 270H292V187H315" class="topic"/>
  <path d="M285 300H299V232H315" class="topic"/>
  <path d="M285 330H306V277H315" class="topic"/>
  <path d="M285 360H312V322H315" class="topic"/>

  <rect x="545" y="165" width="150" height="192" class="box entry"/><text x="620" y="196" text-anchor="middle" class="node mono">/leg_entry_node</text><text x="620" y="225" text-anchor="middle" class="text">深度下部 ROI</text><text x="620" y="249" text-anchor="middle" class="text">双连通域腿检测</text><text x="620" y="273" text-anchor="middle" class="text">左右内缘 2D→3D</text><text x="620" y="297" text-anchor="middle" class="text">间距 / 中心 / 速度</text><text x="620" y="321" text-anchor="middle" class="small">拒绝单腿与粘连 fallback</text><text x="620" y="341" text-anchor="middle" class="small">稳定窗口 6/8 帧</text>

  <rect x="545" y="405" width="150" height="192" class="box vision"/><text x="620" y="436" text-anchor="middle" class="node mono">/detector_node</text><text x="620" y="465" text-anchor="middle" class="text">YOLO bbox</text><text x="620" y="489" text-anchor="middle" class="text">ROI 深度滤波</text><text x="620" y="513" text-anchor="middle" class="text">实时内参投影</text><text x="620" y="537" text-anchor="middle" class="text">乳头相机系 3D</text><text x="620" y="565" text-anchor="middle" class="small mono">/detector_node/detections</text>
  <path d="M505 187H520M505 232H520M505 277H520M505 322H520M520 187V505" class="dataBus"/>
  <circle cx="520" cy="210" r="3" class="junction"/><path d="M520 210H545" class="topic"/>
  <circle cx="520" cy="260" r="3" class="junction"/><path d="M520 260H545" class="topic"/>
  <circle cx="520" cy="310" r="3" class="junction"/><path d="M520 310H545" class="topic"/>
  <circle cx="520" cy="455" r="3" class="junction"/><path d="M520 455H545" class="topic"/>
  <circle cx="520" cy="480" r="3" class="junction"/><path d="M520 480H545" class="topic"/>
  <circle cx="520" cy="505" r="3" class="junction"/><path d="M520 505H545" class="topic"/>

  <rect x="760" y="165" width="285" height="126" class="box entry"/><text x="902" y="196" text-anchor="middle" class="node mono">/entry/status · EntryStatus</text><text x="902" y="225" text-anchor="middle" class="text">valid · stable · corridor_clear</text><text x="902" y="249" text-anchor="middle" class="text">gap_m · line_speed_mps · cow_track_id</text><text x="902" y="273" text-anchor="middle" class="small">间距未标定时始终禁止放行</text><path d="M695 245H760" class="topic"/>

  <rect x="760" y="405" width="285" height="192" class="box vision"/><text x="902" y="436" text-anchor="middle" class="node mono">/teat_id_node</text><text x="902" y="465" text-anchor="middle" class="text">FL / RL / RR / FR 语义 ID</text><text x="902" y="489" text-anchor="middle" class="text">全排列最小位移匹配</text><text x="902" y="513" text-anchor="middle" class="text">刚体模板 + 两点短时补点</text><text x="902" y="537" text-anchor="middle" class="text">真实与预测来源分离</text><text x="902" y="565" text-anchor="middle" class="small mono">/udder/tracked_detections</text><text x="902" y="584" text-anchor="middle" class="small mono">/udder/status</text><path d="M695 520H760" class="topic"/>

  <rect x="760" y="645" width="285" height="106" class="box tf"/><text x="902" y="676" text-anchor="middle" class="node">历史 TF2 转换</text><text x="902" y="703" text-anchor="middle" class="text mono">image stamp: camera → base_link</text><text x="902" y="728" text-anchor="middle" class="small">眼在手上禁止回退到最新 TF</text><path d="M902 597V645" class="tfline"/>
  <rect x="760" y="800" width="285" height="62" class="box tf"/><text x="902" y="827" text-anchor="middle" class="node mono">/hand_eye_tf</text><text x="902" y="849" text-anchor="middle" class="small mono">tool0 → sick_camera_optical_frame</text><path d="M902 800V751" class="tfline"/>

  <rect x="1115" y="165" width="305" height="145" class="box entry"/><text x="1267" y="196" text-anchor="middle" class="node">EntryGate 入场许可</text><text x="1267" y="224" text-anchor="middle" class="text">机械臂就绪 + 双腿稳定 + 间距合格</text><text x="1267" y="248" text-anchor="middle" class="text">数据新鲜 + 置信度 + 乳头 ID 锁定</text><text x="1267" y="272" text-anchor="middle" class="text">剩余时间 ≥ 动作时间 + 安全余量</text><text x="1267" y="294" text-anchor="middle" class="small">不满足任一条件：WAIT_ENTRY</text><path d="M1045 228H1115" class="topic"/>

  <rect x="1115" y="345" width="305" height="210" class="box control"/><text x="1267" y="376" text-anchor="middle" class="node mono">/estun_driver</text><text x="1267" y="404" text-anchor="middle" class="text">WAIT_ENTRY → LEG_PRETRACK（可选）</text><text x="1267" y="428" text-anchor="middle" class="text">→ TEAT_WORK → RETURNING → COMPLETE</text><text x="1267" y="456" text-anchor="middle" class="text">CA Kalman XYZ · freshness</text><text x="1267" y="480" text-anchor="middle" class="text">相机系 3D PBVS · 历史 TF</text><text x="1267" y="504" text-anchor="middle" class="text">Ruckig v/a/j · 工作空间</text><text x="1267" y="530" text-anchor="middle" class="small">乳头接管后关闭牛腿检测</text><path d="M1267 310V345" class="topic"/><path d="M1045 505H1115" class="topic"/><path d="M1045 698H1080V480H1115" class="tfline"/>

  <rect x="1115" y="595" width="305" height="112" class="box control"/><text x="1267" y="626" text-anchor="middle" class="node">唯一 250 Hz CRI 线程</text><text x="1267" y="653" text-anchor="middle" class="text">反馈 → PBVS → Ruckig → 绝对位置命令</text><text x="1267" y="678" text-anchor="middle" class="small">ROS 发布与门控不进入实时线程</text><path d="M1267 555V595" class="topic"/>
  <rect x="1115" y="750" width="305" height="112" class="box safe"/><text x="1267" y="781" text-anchor="middle" class="node">安全监督</text><text x="1267" y="807" text-anchor="middle" class="text">7 s 超时 · 目标丢失 · 命令误差</text><text x="1267" y="831" text-anchor="middle" class="text">报警 / 急停 / 碰撞 → FAULT_LATCHED</text><text x="1267" y="851" text-anchor="middle" class="small">碰撞后不自动清错或盲目撤退</text><path d="M1267 750V707" class="safeLine"/>

  <rect x="1480" y="330" width="285" height="168" class="box robot"/><text x="1622" y="364" text-anchor="middle" class="node">ESTUN 机械臂</text><text x="1622" y="395" text-anchor="middle" class="text">Codroid / CRI 控制器</text><text x="1622" y="423" text-anchor="middle" class="text mono">base_link → tool0</text><text x="1622" y="450" text-anchor="middle" class="small">TCP 位姿反馈</text><text x="1622" y="475" text-anchor="middle" class="small">实时控制命令</text><path d="M1420 650H1455V440H1480" class="topic"/><path d="M1480 470H1455V695H1420" class="tfline"/>
  <rect x="1480" y="555" width="285" height="126" class="box entry"/><text x="1622" y="587" text-anchor="middle" class="node mono">/sprayer/command</text><text x="1622" y="615" text-anchor="middle" class="text">TEAT_WORK + staying + 目标许可</text><text x="1622" y="640" text-anchor="middle" class="small">默认 disabled：永远 false</text><text x="1622" y="661" text-anchor="middle" class="small">模拟量需要独立硬件适配器</text><path d="M1420 510H1455V618H1480" class="safeLine"/>
  <rect x="1480" y="750" width="285" height="112" class="box safe"/><text x="1622" y="782" text-anchor="middle" class="node">故障输出与人工恢复</text><text x="1622" y="809" text-anchor="middle" class="text mono">/estun_driver/recover</text><text x="1622" y="833" text-anchor="middle" class="small">只确认软件锁存，不代替控制器复位</text><path d="M1420 806H1480" class="safeLine"/>

  <rect x="330" y="650" width="365" height="112" class="box neutral"/><text x="512" y="681" text-anchor="middle" class="node mono">/sick_yolo_debug</text><text x="512" y="708" text-anchor="middle" class="text">bbox + 乳头 ID + 补点状态</text><text x="512" y="732" text-anchor="middle" class="text">牛腿内缘 + 间距 + 速度 + 入场原因</text><text x="512" y="752" text-anchor="middle" class="small mono">/sick_yolo_debug/image</text><path d="M620 357V382H685V650" class="mutedLine"/><path d="M620 597V625H650V650" class="mutedLine"/><path d="M760 245H730V680H695" class="mutedLine"/>

  <text x="40" y="930" class="section">单轮生产状态与感知切换</text>
  <rect x="40" y="960" width="205" height="66" class="phase"/><text x="142" y="987" text-anchor="middle" class="node">WAIT_ENTRY</text><text x="142" y="1010" text-anchor="middle" class="small">牛腿检测开启 · 不动作</text>
  <rect x="300" y="960" width="215" height="66" class="phase"/><text x="407" y="987" text-anchor="middle" class="node">LEG_PRETRACK</text><text x="407" y="1010" text-anchor="middle" class="small">可选低速跟随牛腿中心</text>
  <rect x="570" y="960" width="245" height="66" class="phase"/><text x="692" y="987" text-anchor="middle" class="node">TEAT_WORK</text><text x="692" y="1010" text-anchor="middle" class="small">关闭牛腿检测 · 四乳头动作</text>
  <rect x="870" y="960" width="205" height="66" class="phase"/><text x="972" y="987" text-anchor="middle" class="node">RETURNING</text><text x="972" y="1010" text-anchor="middle" class="small">喷头关闭 · Ruckig 回位</text>
  <rect x="1130" y="960" width="185" height="66" class="pass"/><text x="1222" y="987" text-anchor="middle" class="node">COMPLETE</text><text x="1222" y="1010" text-anchor="middle" class="small">本轮完成</text>
  <rect x="1460" y="960" width="285" height="66" class="block"/><text x="1602" y="987" text-anchor="middle" class="node">FAULT_LATCHED</text><text x="1602" y="1010" text-anchor="middle" class="small">任意阶段故障 → 停止 + 喷头关闭</text>
  <path d="M245 993H300M515 993H570M815 993H870M1075 993H1130" class="controlLine"/><path d="M142 1026V1080H1602V1026" class="safeLine"/>

  <text x="40" y="1125" class="section">图例</text><line x1="110" y1="1120" x2="165" y2="1120" class="topic"/><text x="175" y="1125" class="small">Topic / 数据流</text><line x1="330" y1="1120" x2="385" y2="1120" class="tfline"/><text x="395" y="1125" class="small">TF / 历史坐标转换</text><line x1="590" y1="1120" x2="645" y2="1120" class="controlLine"/><text x="655" y="1125" class="small">Service / 状态控制</text><line x1="845" y1="1120" x2="900" y2="1120" class="safeLine"/><text x="910" y="1125" class="small">安全联锁 / 故障路径</text><text x="1280" y="1125" class="small">安全默认：entry gate / pretrack / IO / auto recovery 均需现场标定后启用</text>
</svg>
